server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # The linen scanner calls getUserMedia, so camera must be allowed for this
    # origin — camera=() made "Start Camera" fail with NotAllowedError everywhere.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss: https://quotation-service-three.vercel.app https://bill-service-puce.vercel.app https://love-laundry-user-service.vercel.app https://worker-service-zeta.vercel.app https://laundry-management-liard.vercel.app https://love-ai-ten.vercel.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /icon.png {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # love-ai already serves everything under /api/ai — pass through unchanged.
    location /api/ai/ {
        proxy_pass http://ai-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/quotation/ {
        rewrite ^/api/quotation/(.*)$ /$1 break;
        proxy_pass http://quotation-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live linen channel. Separate block because only a WebSocket needs the
    # Upgrade/Connection pair: setting them on the general API location would
    # turn every keep-alive API request into an upgrade candidate.
    #
    # access_log off: the socket authenticates with a bearer token in the query
    # string (a browser cannot set headers on an upgrade), and the default log
    # format records the full request line — including that token.
    location /api/bills/ws/ {
        rewrite ^/api/bills/(.*)$ /$1 break;
        proxy_pass http://bills-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # The client heartbeats every 20s; this only stops a quiet shift from
        # being cut off by the default 60s read timeout.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;
    }

    location /api/bills/ {
        rewrite ^/api/bills/(.*)$ /$1 break;
        proxy_pass http://bills-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/user/ {
        rewrite ^/api/user/(.*)$ /$1 break;
        proxy_pass http://user-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/workers/ {
        rewrite ^/api/workers/(.*)$ /$1 break;
        proxy_pass http://workers-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/mgmt/ {
        rewrite ^/api/mgmt/(.*)$ /$1 break;
        proxy_pass http://mgmt-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}